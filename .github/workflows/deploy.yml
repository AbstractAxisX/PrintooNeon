name: Server Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | deploy"
        required: true
        default: "inspect"
      port:
        description: "Port the app listens on (deploy mode)"
        required: false
        default: "3000"

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSHPASS: ${{ secrets.DEPLOY_PASS }}
      SSH_OPTS: "-o StrictHostKeyChecking=no -o ConnectTimeout=25 -o ControlMaster=auto -o ControlPath=/tmp/cm-%r@%h-%p -o ControlPersist=600"
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Open SSH connection (with retries)
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            if sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'echo "SSH connection OK"'; then
              exit 0
            fi
            echo "attempt $i failed — retrying in 20s"
            sleep 20
          done
          echo "::error::Could not establish SSH connection"
          exit 1

      - name: Inspect server (read-only)
        if: ${{ github.event.inputs.mode == 'inspect' }}
        run: |
          set -e
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'EOS'
          echo "=== OS ==="
          uname -m; grep PRETTY /etc/os-release
          echo "=== RAM ==="; free -m | head -2
          echo "=== DISK ==="; df -h / | tail -1
          echo "=== LISTENING PORTS ==="
          ss -tlnp | sed 's/  */ /g' | cut -d' ' -f4-
          echo "=== DOCKER ==="
          docker ps --format '{{.Names}} | {{.Ports}} | {{.Status}}' 2>/dev/null || echo "no docker"
          echo "=== PM2 ==="
          pm2 list 2>/dev/null || echo "no pm2"
          echo "=== RUNNING SERVICES ==="
          systemctl list-units --type=service --state=running --no-pager --no-legend | head -25
          echo "=== TOOLS ==="
          for t in node bun git nginx caddy tar curl; do command -v "$t" >/dev/null 2>&1 && echo "$t: $(command -v $t)" || echo "$t: missing"; done
          echo "=== FIREWALL ==="
          ufw status verbose 2>/dev/null || echo "no ufw"
          echo "=== SWAP ==="; swapon --show 2>/dev/null || echo "no swap"
          EOS

      - name: Verify deployment (read-only)
        if: ${{ github.event.inputs.mode == 'verify' }}
        run: |
          set -e
          PORT="${{ github.event.inputs.port }}"
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $PORT" <<'EOS'
          set -e
          PORT="${1:-3100}"
          echo "=== printoo app ==="
          systemctl is-active printoo
          curl -s -o /tmp/page.html -w "GET / -> %{http_code}\n" "http://127.0.0.1:$PORT/"
          grep -o "<title>[^<]*</title>" /tmp/page.html || echo "NO TITLE FOUND"
          curl -s -o /dev/null -w "GET /fonts/pacifico.woff2 -> %{http_code}\n" "http://127.0.0.1:$PORT/fonts/pacifico.woff2"
          echo "--- POST /api/orders ---"
          curl -s -X POST "http://127.0.0.1:$PORT/api/orders" \
            -H "Content-Type: application/json" \
            -d '{"customerName":"Health Check","phone":"5550102030","note":"deployment verification","text":"HELLO","fontId":"pacifico","colorId":"warmpink","mode":"solid","widthCm":60}'
          echo ""
          echo "=== other services still healthy (must all be up) ==="
          systemctl is-active printoo24-admin.service || echo "ADMIN SERVICE DOWN!"
          docker ps --format '{{.Names}} | {{.Status}}'
          curl -s -o /dev/null -w "admin (localhost:3000) -> %{http_code}\n" "http://127.0.0.1:3000/" || true
          curl -s -o /dev/null -w "nginx (localhost:80) -> %{http_code}\n" "http://127.0.0.1:80/" || true
          echo "VERIFY_SERVER_OK"
          EOS

      - name: External verification (from runner)
        if: ${{ github.event.inputs.mode == 'verify' }}
        run: |
          set -e
          PORT="${{ github.event.inputs.port }}"
          echo "--- external GET / ---"
          code=$(curl -s -o /tmp/ext.html -w "%{http_code}" --max-time 25 "http://$DEPLOY_HOST:$PORT/")
          echo "HTTP $code"
          grep -o "<title>[^<]*</title>" /tmp/ext.html || echo "NO TITLE"
          echo "--- external POST /api/orders ---"
          resp=$(curl -s -X POST --max-time 25 "http://$DEPLOY_HOST:$PORT/api/orders" \
            -H "Content-Type: application/json" \
            -d '{"customerName":"Ext Check","phone":"5550102040","text":"TEST","fontId":"monoton","colorId":"iceblue","mode":"solid","widthCm":45}')
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' && echo "EXTERNAL_API_OK"

      - name: Upload project to server
        if: ${{ github.event.inputs.mode == 'deploy' }}
        run: |
          set -e
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/printoo"
          for i in 1 2 3; do
            if tar czf - \
              --exclude=.git \
              --exclude=node_modules \
              --exclude=.next \
              --exclude=dev.log \
              --exclude=server.log \
              --exclude=db \
              --exclude=tool-results \
              --exclude=agent-ctx \
              --exclude=.env \
              -C "$GITHUB_WORKSPACE" . \
              | sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "tar xzf - -C /opt/printoo"; then
              echo "upload done"; exit 0
            fi
            echo "upload attempt $i failed — retrying"; sleep 10
          done
          echo "::error::upload failed"
          exit 1

      - name: Build & launch on server
        if: ${{ github.event.inputs.mode == 'deploy' }}
        run: |
          set -e
          PORT="${{ github.event.inputs.port }}"
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $PORT" < scripts/server-deploy.sh

      - name: External reachability check
        if: ${{ github.event.inputs.mode == 'deploy' }}
        run: |
          set -e
          PORT="${{ github.event.inputs.port }}"
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "http://$DEPLOY_HOST:$PORT/" || echo "000")
          echo "External HTTP $DEPLOY_HOST:$PORT -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::External check returned $code (host firewall may block this port; SSH still works)"
          fi
