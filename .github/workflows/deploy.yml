name: Server Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | deploy"
        required: true
        default: "inspect"
      port:
        description: "Port the app listens on (deploy mode)"
        required: false
        default: "3000"

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSHPASS: ${{ secrets.DEPLOY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect server (read-only)
        if: ${{ github.event.inputs.mode == 'inspect' }}
        run: |
          set -e
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'EOS'
          echo "=== OS ==="
          uname -m; grep PRETTY /etc/os-release
          echo "=== RAM ==="; free -m | head -2
          echo "=== DISK ==="; df -h / | tail -1
          echo "=== LISTENING PORTS ==="
          ss -tlnp | sed 's/  */ /g' | cut -d' ' -f4-
          echo "=== DOCKER ==="
          docker ps --format '{{.Names}} | {{.Ports}} | {{.Status}}' 2>/dev/null || echo "no docker"
          echo "=== PM2 ==="
          pm2 list 2>/dev/null || echo "no pm2"
          echo "=== RUNNING SERVICES ==="
          systemctl list-units --type=service --state=running --no-pager --no-legend | head -25
          echo "=== TOOLS ==="
          for t in node bun git nginx caddy tar curl; do command -v "$t" >/dev/null 2>&1 && echo "$t: $(command -v $t)" || echo "$t: missing"; done
          echo "=== FIREWALL ==="
          ufw status verbose 2>/dev/null || echo "no ufw"
          echo "=== SWAP ==="; swapon --show 2>/dev/null || echo "no swap"
          EOS

      - name: Upload project to server
        if: ${{ github.event.inputs.mode == 'deploy' }}
        run: |
          set -e
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/printoo"
          tar czf - \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=dev.log \
            --exclude=server.log \
            --exclude=db \
            --exclude=tool-results \
            --exclude=agent-ctx \
            --exclude=.env \
            -C "$GITHUB_WORKSPACE" . \
            | sshpass -e ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "tar xzf - -C /opt/printoo"
          echo "upload done"

      - name: Build & launch on server
        if: ${{ github.event.inputs.mode == 'deploy' }}
        run: |
          set -e
          PORT="${{ github.event.inputs.port }}"
          sshpass -e ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $PORT" < scripts/server-deploy.sh

      - name: External reachability check
        if: ${{ github.event.inputs.mode == 'deploy' }}
        run: |
          set -e
          PORT="${{ github.event.inputs.port }}"
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "http://$DEPLOY_HOST:$PORT/" || echo "000")
          echo "External HTTP $DEPLOY_HOST:$PORT -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::External check returned $code (host firewall may block this port; SSH still works)"
          fi
