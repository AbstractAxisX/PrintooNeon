<style>
  body{background-color:#F3F0E8;background-image:radial-gradient(#E3DDCE 1px,transparent 1px);background-size:22px 22px}
  @keyframes pulse{55%{box-shadow:0 0 0 6px rgba(78,138,90,0)}}
  @keyframes pop{50%{transform:scale(1.25)}}
  @keyframes tickIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .stock-dot{box-shadow:0 0 0 0 rgba(78,138,90,.35);animation:pulse 2.2s infinite}
  .fav.on svg{fill:#C0563F;stroke:#C0563F}
  .fav.on{animation:pop .4s}
  .add .ic-check{display:none}
  .add.on .ic-bag{display:none}
  .add.on .ic-check{display:block}
  .add.on{background:#24402F}
  .tick{display:inline-block;animation:tickIn .38s cubic-bezier(.22,.7,.32,1)}
  .badge-pop{animation:pop .45s}
  .fly-dot{position:fixed;z-index:80;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:999px;background:#4E8A5A;box-shadow:0 3px 8px rgba(38,48,42,.35);pointer-events:none;transition:transform .6s cubic-bezier(.25,.75,.35,1),opacity .6s}

  /* ---- ساختار Embla: فقط درگ و اسکرول، بدون دکمه ---- */
  .embla__viewport{overflow:hidden;direction:rtl;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;padding-top:10px;padding-bottom:30px}
  .embla__viewport:active{cursor:grabbing}
  .embla__container{display:flex}
  .embla__slide{flex:0 0 auto;width:252px;padding-inline-start:14px}
  @media (min-width:640px){.embla__slide{width:260px;padding-inline-start:16px}}
  @media (min-width:1024px){.embla__slide{width:280px;padding-inline-start:18px}}
  .embla__slide>*{width:100%}
  .embla--native{overflow-x:auto}
  .embla--native .embla__slide{scroll-snap-align:inline-start}
  @media (prefers-reduced-motion:reduce){.stock-dot,.tick,.fav.on,.badge-pop{animation:none!important}}
</style>
</head>

    products: [
      { id:'e1', art:'jar',     tint:'#C0563F', icon:'leaf',  cat:'مراقبت پوست', brand:'آرایشی بهشاد',     name:'کرم ترمیم‌کننده دست',            spec:'قوطی ۷۵ میلی‌لیتری · بدون عطر',        price:132000, stock:true },
      { id:'e2', art:'box',     tint:'#2E4B3C', icon:'sun',   cat:'ویتامین',     brand:'داروسازی مهرگان',  name:'قرص مولتی‌ویتامین روزانه',       spec:'بسته ۶۰ عددی · بزرگسالان',            price:310000, old:360000, stock:true },

/* ---------- شمارش معکوس ---------- */
function useCountdown(endsAt) {
  const [left, setLeft] = useState(() => Math.max(0, endsAt - Date.now()));
  useEffect(() => {
    const iv = setInterval(() => setLeft(Math.max(0, endsAt - Date.now())), 1000);
    return () => clearInterval(iv);
  }, [endsAt]);
  const d = Math.floor(left / 864e5), h = Math.floor(left / 36e5) % 24,
        m = Math.floor(left / 6e4) % 60, s = Math.floor(left / 1e3) % 60;
  return { d, h, m, s };
}

/* ---------- نقطه‌ی پرواز به سبد خرید ---------- */
function flyToCart(fromEl) {
  try {
    const cart = document.getElementById('cartBtn');
    if (!cart || !fromEl) return;
    const a = fromEl.getBoundingClientRect(), b = cart.getBoundingClientRect();
    const dot = document.createElement('div');
    dot.className = 'fly-dot';
    dot.style.left = (a.left + a.width / 2) + 'px';
    dot.style.top = (a.top + a.height / 2) + 'px';
    document.body.appendChild(dot);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      dot.style.transform = 'translate(' + ((b.left + b.width / 2) - (a.left + a.width / 2)) + 'px,' +
                                          ((b.top + b.height / 2) - (a.top + a.height / 2)) + 'px) scale(.35)';
      dot.style.opacity = '0';
    }));
    setTimeout(() => dot.remove(), 650);
  } catch (err) { /* بی‌خیال */ }
}

/* ---------- هوک Embla (در پروژه‌ی ری‌ال جایگزین useEmblaCarousel رسمی می‌شود) ---------- */
function useEmbla(options) {
  const ref = useRef(null);
  const [api, setApi] = useState(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return undefined;
    if (!window.EmblaCarousel) { el.classList.add('embla--native'); return undefined; }
    const inst = window.EmblaCarousel(el, options);
    setApi(inst);
    return () => { inst.destroy(); setApi(null); };
  }, []);
  return [ref, api];
}

/* ---------- پالت دو نوار: سبز تیره / شنی گرم ---------- */
function toneStyles(tone) {
  return tone === 'dark' ? {
    dark: true,
    section: 'relative rounded-[26px] sm:rounded-[30px] bg-accent overflow-hidden shadow-[0_28px_56px_-38px_rgba(38,48,42,.55)]',
    pad: 'px-4 pt-5 pb-5 sm:px-6 sm:pt-6 sm:pb-6',
    tag: 'bg-brick text-[#F7ECE4]',
    title: 'text-[#F3F0E8]', note: 'text-[#AEBFB0]', meta: 'text-[#AEBFB0]',
    track: 'rgba(243,240,232,.16)', fill: 'rgba(243,240,232,.85)',
    btn: 'border border-[#F3F0E8]/25 text-[#F3F0E8] hover:bg-[#F3F0E8]/10 hover:border-[#F3F0E8]/40',
  } : {
    dark: false,
    section: 'relative rounded-[26px] sm:rounded-[30px] bg-[#EFEADC] border border-[#DFD9C7]',
    pad: 'px-4 pt-5 pb-5 sm:px-6 sm:pt-6 sm:pb-6',

    btn: 'bg-white border border-line text-accent hover:bg-[#E9EFE5] hover:border-[#C4CDBA]',
  };
}

          <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="#F3F0E8" strokeWidth="2.6" strokeLinecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
        </div>
        <div>
          <div className="font-naskh font-bold text-[16px] leading-tight">داروخانه سبزدار</div>
          <div className="text-[10.5px] text-muted mt-0.5">نسخه‌ی سلامت، تحویل سریع</div>

        <svg viewBox="0 0 24 24" className="w-[17px] h-[17px]" fill="none" stroke="#26302A" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M6.5 8h11l-.9 11.2a1.8 1.8 0 0 1-1.8 1.6H9.2a1.8 1.8 0 0 1-1.8-1.6L6.5 8z"/><path d="M9.2 8V6.8a2.8 2.8 0 0 1 5.6 0V8"/></svg>
        {cart > 0 && (

/* نشان روی برچسب: صلیب / قلب / خورشید / ماه / برگ / قطره */
function LabelMark({ icon, color }) {
  const cream = '#FDFCF7';
  return (
    <g>
      {icon === 'cross' && <g>
        <circle r="12" fill={color}/>
        <rect x="-2.75" y="-8.5" width="5.5" height="17" rx="1.25" fill={cream}/>
        <rect x="-8.5" y="-2.75" width="17" height="5.5" rx="1.25" fill={cream}/>
      </g>}
      {icon === 'heart' && <g>
        <circle r="12" fill={color}/>
        <path d="M0 8.5C-6.5 3.5 -10.5 -0.5 -10.5 -5C-10.5 -8.4 -7.8 -10.5 -5.2 -10.5C-3 -10.5 -1.2 -9.3 0 -7.3C1.2 -9.3 3 -10.5 5.2 -10.5C7.8 -10.5 10.5 -8.4 10.5 -5C10.5 -0.5 6.5 3.5 0 8.5Z" fill={cream}/>
      </g>}
      {icon === 'sun' && <g>
        <circle r="12" fill={color}/>
        <circle r="4.5" fill={cream}/>
        {[0,45,90,135,180,225,270,315].map(a => (
          <line key={a} x1="0" y1="-7.5" x2="0" y2="-10" stroke={cream} strokeWidth="2" strokeLinecap="round" transform={'rotate(' + a + ')'}/>
        ))}
      </g>}
      {icon === 'moon' && <g>
        <circle r="12" fill={color}/>
        <path d="M1.5 -6.5A7 7 0 1 0 1.5 6.5A5.4 5.4 0 1 1 1.5 -6.5Z" fill={cream}/>
      </g>}
      {icon === 'leaf' && <g>
        <circle r="12" fill={color}/>
        <path d="M-4.5 -6.5C3.5 -8 8.5 -1.5 3.5 5.5C-3.5 7 -7.5 1 -4.5 -6.5Z" fill={cream}/>
        <path d="M-3.5 -4L3 3.5" stroke={color} strokeWidth="1.4" strokeLinecap="round"/>
      </g>}
      {icon === 'drop' && <g>
        <circle r="12" fill={color}/>
        <path d="M0 -7Q6 -0.5 6 3A6.2 6.2 0 1 1 -6 3Q-6 -0.5 0 -7Z" fill={cream}/>
      </g>}
    </g>
  );
}

function ArtBlister({ p }) {
  const tint = p.tint || '#4E8A5A';
  const cols = [94, 120, 146], rows = [102, 130, 158, 186];
  return (
    <g transform="rotate(-6 120 141)">
      <rect x="70" y="74" width="112" height="134" rx="13" fill="#E7DFCB"/>
      <rect x="70" y="74" width="112" height="12" rx="6" fill="#D6CDB4"/>
      <rect x="70" y="74" width="112" height="134" rx="13" fill="none" stroke="#D0C7AE" strokeWidth="1.5"/>

        if (ri === 3 && ci === 0) {
          return <circle key={x + '-' + y} cx={x} cy={y} r="12" fill="#26302A" opacity=".08"/>; /* یک خانه خالی */
        }
        return (
          <g key={x + '-' + y}>
            <circle cx={x} cy={y} r="12" fill={tint}/>
            <circle cx={x - 3.5} cy={y - 3.5} r="4.5" fill="#fff" opacity=".42"/>
          </g>
        );
      }))}

  );

    <g>
      <circle cx="120" cy="86" r="15" fill="#2E4B3C"/>
      <circle cx="114.5" cy="80.5" r="4" fill="#fff" opacity=".3"/>
      <rect x="117" y="88" width="6" height="14" fill="#DCE4D6" opacity=".95"/>
      <rect x="107" y="100" width="26" height="22" rx="7" fill="#2E4B3C"/>
      <rect x="107" y="100" width="26" height="5" rx="2.5" fill="#fff" opacity=".15"/>
      <path d="M98 150Q98 132 114 130L126 130Q142 132 142 150L142 196Q142 212 126 212L114 212Q98 212 98 196Z" fill={tint}/>
      <rect x="104" y="146" width="7" height="56" rx="3.5" fill="#fff" opacity=".25"/>
      <rect x="105" y="154" width="30" height="44" rx="6" fill="#FDFCF7"/>
      <g transform="translate(120 170)"><LabelMark icon={p.icon} color="#2E4B3C"/></g>
      <rect x="110" y="184" width="20" height="3" rx="1.5" fill="#DAD3C2"/>
      <path d="M163 152q7 10 7 15a7 7 0 1 1-14 0q0-5 7-15z" fill="#4E8A5A" opacity=".9"/>
      <circle cx="166" cy="163" r="2" fill="#fff" opacity=".5"/>
    </g>
  );
}

function ArtSpray({ p }) {
  const tint = p.tint || '#4E8A5A';
  return (
    <g>
      <rect x="102" y="54" width="36" height="34" rx="10" fill={tint}/>
      <rect x="102" y="54" width="36" height="8" rx="4" fill="#fff" opacity=".16"/>
      <rect x="88" y="62" width="16" height="11" rx="3.5" fill="#26302A" opacity=".82"/>
      <rect x="84" y="65.5" width="5" height="4.5" rx="1.5" fill="#26302A" opacity=".82"/>
      <circle cx="74" cy="59" r="2.5" fill={tint} opacity=".55"/>
      <circle cx="68" cy="66" r="2" fill={tint} opacity=".4"/>
      <circle cx="74" cy="73" r="2.5" fill={tint} opacity=".55"/>
      <rect x="112" y="88" width="16" height="12" fill={tint}/>
      <rect x="94" y="100" width="52" height="112" rx="16" fill="#FDFCF7" stroke="#D9E2D2" strokeWidth="1.5"/>
      <rect x="94" y="136" width="52" height="48" fill="#EAE3D2"/>
      <g transform="translate(120 154)"><LabelMark icon={p.icon} color="#2E4B3C"/></g>
      <rect x="105" y="172" width="30" height="3" rx="1.5" fill="#DAD3C2"/>
      <rect x="109" y="179" width="22" height="3" rx="1.5" fill="#E4DECE"/>
      <path d="M94 186h52v10q0 16-16 16h-20q-16 0-16-16z" fill={tint}/>
    </g>
  );
}

function ArtJar({ p }) {
  const tint = p.tint || '#C0563F';
  return (
    <g>
      <rect x="82" y="96" width="76" height="26" rx="10" fill={tint}/>
      <rect x="82" y="96" width="76" height="7" rx="3.5" fill="#fff" opacity=".18"/>
      {[96,108,120,132,144].map(x => (
        <rect key={x} x={x} y="110" width="2" height="8" rx="1" fill="#26302A" opacity=".14"/>
      ))}
      <path d="M92 122h56v70q0 20-20 20h-16q-20 0-20-20z" fill="#EAE3D2"/>
      <rect x="140" y="128" width="5" height="42" rx="2.5" fill="#fff" opacity=".55"/>
      <rect x="102" y="138" width="36" height="54" rx="7" fill="#FDFCF7"/>
      <g transform="translate(120 156)"><LabelMark icon={p.icon} color="#2E4B3C"/></g>
      <rect x="108" y="180" width="24" height="3" rx="1.5" fill="#DAD3C2"/>
      <rect x="112" y="187" width="16" height="3" rx="1.5" fill="#E4DECE"/>
    </g>
  );
}

function ProductArt({ p }) {
  switch (p.art) {
    case 'box':     return <ArtBox p={p}/>;
    case 'syrup':   return <ArtSyrup p={p}/>;
    case 'blister': return <ArtBlister p={p}/>;
    case 'dropper': return <ArtDropper p={p}/>;
    case 'spray':   return <ArtSpray p={p}/>;
    case 'jar':     return <ArtJar p={p}/>;
    default:        return <ArtBottle p={p}/>;
  }
}

/* ---------- کارت محصول: جمع‌وجور و ظریف ---------- */
function ProductCard({ p, onAdd }) {
  const [fav, setFav] = useState(false);
  const [added, setAdded] = useState(false);
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);

  const off = p.old ? Math.round((1 - p.price / p.old) * 100) : 0;

  const handleAdd = e => {
    if (!p.stock) return;
    setAdded(true);
    onAdd && onAdd();
    flyToCart(e.currentTarget);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setAdded(false), 1600);
  };

  return (
    <article className="h-full w-full bg-white border border-line rounded-[22px] p-2.5 pb-4 shadow-[0_16px_32px_-24px_rgba(38,48,42,.18)] transition duration-300 hover:-translate-y-1 hover:shadow-[0_24px_44px_-26px_rgba(38,48,42,.24)]">
      <div className={'relative h-[156px] sm:h-[170px] lg:h-[186px] bg-[#E9EFE5] rounded-[15px] grid place-items-center overflow-hidden ' + (p.stock ? '' : 'grayscale opacity-90')}>
        <span className="absolute top-3 right-3 z-10 bg-white/90 border border-[#D5DECB] rounded-full px-2.5 py-1 text-[10px] font-semibold text-accent">{p.cat}</span>
        <button onClick={() => setFav(v => !v)} aria-label="افزودن به علاقه‌مندی‌ها" aria-pressed={fav}
          className={'fav absolute top-2.5 left-2.5 z-10 w-[32px] h-[32px] rounded-full bg-white/90 border border-[#D5DECB] grid place-items-center cursor-pointer transition hover:scale-110 active:scale-90' + (fav ? ' on' : '')}>
          <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="#6B7267" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20.5C7 16.5 3.5 13.2 3.5 9.5 3.5 7 5.5 5 8 5c1.6 0 3.1.8 4 2.1C12.9 5.8 14.4 5 16 5c2.5 0 4.5 2 4.5 4.5 0 3.7-3.5 7-8.5 11z"/></svg>
        </button>
        <svg viewBox="0 0 240 240" className="w-[100px] sm:w-[110px] lg:w-[122px] h-auto" aria-hidden="true">
          <Backdrop/>
          <ProductArt p={p}/>
        </svg>
      </div>

      <div className="px-2 pt-3">
        <div className="flex items-center justify-between gap-2">
          <span className="text-[11px] font-medium text-muted truncate">{p.brand}</span>
          {p.stock ? (
            <span className="shrink-0 flex items-center gap-1.5 text-[10.5px] font-semibold text-accent">
              <span className="stock-dot w-[6px] h-[6px] rounded-full bg-[#4E8A5A]"></span>موجود
            </span>
          ) : (
            <span className="shrink-0 flex items-center gap-1.5 text-[10.5px] font-semibold text-[#B4AE9E]">
              <span className="w-[6px] h-[6px] rounded-full bg-[#B4AE9E]"></span>ناموجود
            </span>
          )}
        </div>

        <h3 className="font-naskh text-[15px] font-bold leading-[1.8] mt-1 min-h-[54px]">{p.name}</h3>
        <p className="text-[11px] text-muted mt-0.5 truncate">{p.spec}</p>

        <hr className="my-3 border-0 border-t-[1.5px] border-dashed border-[#DCD6C6]"/>

        <div className="flex items-center justify-between gap-2">
          <div className="min-w-0 min-h-[34px] flex flex-col justify-end">
            {off > 0 && (
              <div className="flex items-center gap-1.5 mb-0.5">
                <s className="text-[11px] text-[#B4AE9E]">{faMoney(p.old)}</s>
                <span className="text-[10px] font-bold text-brick bg-[#F7E9E4] rounded-full px-1.5 py-px">{fa(off)}٪</span>
              </div>
            )}
            <div className="flex items-baseline gap-1 whitespace-nowrap">
              <span className="text-[17px] font-extrabold tracking-tight">{faMoney(p.price)}</span>
              <span className="text-[11px] font-medium text-muted">تومان</span>
            </div>
          </div>

          <button onClick={handleAdd} disabled={!p.stock}
            className={'add shrink-0 flex items-center justify-center gap-1.5 rounded-full px-3.5 py-2.5 text-[12.5px] font-semibold transition active:scale-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 '
              + (added ? 'on ' : '')
              + (p.stock ? 'bg-accent text-[#F5F3EA] cursor-pointer shadow-[0_8px_16px_-8px_rgba(46,75,60,.5)] hover:bg-[#24402F]' : 'bg-[#EAE6D9] text-[#ABA595] cursor-not-allowed')}>
            <svg className="ic-bag w-[15px] h-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M6.5 8h11l-.9 11.2a1.8 1.8 0 0 1-1.8 1.6H9.2a1.8 1.8 0 0 1-1.8-1.6L6.5 8z"/><path d="M9.2 8V6.8a2.8 2.8 0 0 1 5.6 0V8"/></svg>
            <svg className="ic-check w-[15px] h-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            <span>{!p.stock ? 'ناموجود' : (added ? 'اضافه شد' : 'افزودن')}</span>
          </button>
        </div>
      </div>
    </article>
  );
}

/* ---------- اسلات تایمر: هم‌اندازه‌ی یک کارت، ابتدای اسلایدر ---------- */
function TUnit({ v, l }) {
  return (
    <div className="w-[52px] sm:w-[58px] py-2 rounded-xl border border-[#F3F0E8]/15 bg-[#F3F0E8]/[.05]">
      <span key={v} className="tick block text-[16px] sm:text-[18px] font-extrabold leading-none text-[#F3F0E8] tabular-nums">{v}</span>
      <span className="block mt-1 text-[9px] text-[#C9D6C5]">{l}</span>
    </div>
  );
}

function TimerSlide({ endsAt }) {
  const { d, h, m, s } = useCountdown(endsAt);
  const p2 = v => fa(String(v).padStart(2, '0'));
  return (
    <div className="h-full w-full rounded-[22px] border-[1.5px] border-dashed border-[#F3F0E8]/30 relative grid place-items-center px-3 py-6 overflow-hidden">
      {/* ساعت پس‌زمینه: عقربه با هر ثانیه می‌چرخد */}
      <svg viewBox="0 0 200 200" aria-hidden="true"
        className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[150px] sm:w-[170px] lg:w-[190px]">
        <circle cx="100" cy="100" r="92" fill="none" stroke="#F3F0E8" strokeWidth="1.2" opacity=".12"/>
        {Array.from({ length: 12 }, (_, i) => (
          <line key={i} x1="100" y1="9" x2="100" y2={i % 3 === 0 ? 15.5 : 12.5}
            stroke="#F3F0E8" strokeWidth="1.5" opacity=".16" transform={'rotate(' + i * 30 + ' 100 100)'}/>
        ))}
        <g transform={'rotate(' + s * 6 + ' 100 100)'}>
          <line x1="100" y1="100" x2="100" y2="32" stroke="#F3F0E8" strokeWidth="2" strokeLinecap="round" opacity=".38"/>
        </g>
        <circle cx="100" cy="100" r="3.5" fill="#F3F0E8" opacity=".38"/>
      </svg>

      <div className="relative text-center">
        <div className="flex items-center justify-center gap-1.5 text-[11px] font-medium text-[#C9D6C5]">
          <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          فرصت باقی‌مانده
        </div>

        <div className="mt-2 flex items-baseline justify-center gap-2">
          <span key={d} className="tick block text-[40px] sm:text-[46px] font-extrabold leading-none tracking-tight text-[#F3F0E8]">{p2(d)}</span>
          <span className="font-naskh text-[12px] text-[#C9D6C5]">روز</span>
        </div>

        <div className="mx-auto mt-3 mb-3.5 w-8 h-[2.5px] rounded-full bg-brick"/>

        <div className="flex items-stretch justify-center">
          <TUnit v={p2(h)} l="ساعت"/>
          <span className="self-center px-1 text-[16px] font-bold text-[#F3F0E8]/35">:</span>
          <TUnit v={p2(m)} l="دقیقه"/>
          <span className="self-center px-1 text-[16px] font-bold text-[#F3F0E8]/35">:</span>
          <TUnit v={p2(s)} l="ثانیه"/>
        </div>

        <p className="mt-4 text-[9.5px] leading-relaxed text-[#C9D6C5]/70">پس از پایان کمپین، قیمت‌ها به حالت عادی برمی‌گردند</p>
      </div>
    </div>
  );
}

/* ---------- چیپ شمارش معکوس در هدرِ کمپین ---------- */
function MiniCountdown({ endsAt }) {
  const { d, h, m } = useCountdown(endsAt);
  const label = d > 0 ? fa(d) + ' روز و ' + fa(h) + ' ساعت' : fa(h) + ' ساعت و ' + fa(m) + ' دقیقه';
  return (
    <div className="shrink-0 rounded-full border border-[#F3F0E8]/15 bg-[#F3F0E8]/[.06] px-3.5 py-1.5 flex items-center gap-1.5 text-[11px] font-medium text-[#DEE7DB]">
      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>تا پایان:</span>
      <span className="font-bold text-[#F3F0E8]">{label}</span>
    </div>
  );
}

/* ---------- کروسل: درگ + اسکرول لمسی، بدون دکمه‌ی جهت ---------- */
function Carousel({ children, tone, label }) {
  const t = toneStyles(tone);
  const [vpRef, embla] = useEmbla({ axis: 'x', direction: 'rtl', align: 'start', containScroll: 'trimSnaps' });
  const [prog, setProg] = useState(0);
  const down = useRef(false);
  const moved = useRef(false);

  useEffect(() => {
    if (!embla) return undefined;
    const upd = () => { const pr = embla.scrollProgress(); setProg(pr < 0 ? 0 : pr > 1 ? 1 : pr); };
    const onDown = () => { down.current = true; moved.current = false; };
    const onUp = () => { down.current = false; };
    const onScroll = () => { upd(); if (down.current) moved.current = true; };
    upd();
    embla.on('scroll', onScroll);
    embla.on('reInit', upd);
    embla.on('pointerDown', onDown);
    embla.on('pointerUp', onUp);
    return () => {
      embla.off('scroll', onScroll); embla.off('reInit', upd);
      embla.off('pointerDown', onDown); embla.off('pointerUp', onUp);
    };
  }, [embla]);

  /* اگر کارت درگ شده باشد، کلیکِ ناخواسته‌ی بعد از رها کردن حذف می‌شود */
  const onClickCapture = e => {
    if (moved.current) { e.preventDefault(); e.stopPropagation(); }
  };

  /* کلیک/لمس روی نوار پیشرفت = پرش به همان نقطه (جایگزین دکمه‌ها) */
  const seek = e => {
    if (!embla) return;
    const r = e.currentTarget.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (r.width - (e.clientX - r.left)) / r.width)); /* RTL */
    const last = embla.scrollSnapList().length - 1;
    if (last > 0) embla.scrollTo(Math.round(ratio * last));
  };

  const onKey = e => {
    if (!embla) return;
    if (e.key === 'ArrowLeft') embla.scrollNext();
    if (e.key === 'ArrowRight') embla.scrollPrev();
  };

  /* toArray: فرزندهای null حذف می‌شوند تا اسلات خالی ساخته نشود */
  const slides = React.Children.toArray(children);

  return (
    <div className="relative">
      <div ref={vpRef} className="embla__viewport" onClickCapture={onClickCapture}
        role="region" aria-roledescription="کروسل" aria-label={label}>
        <div className="embla__container">
          {slides.map((child, i) => (
            <div className="embla__slide" key={i}
              role="group" aria-roledescription="اسلاید"
              aria-label={fa(i + 1) + ' از ' + fa(slides.length)}>
              {child}
            </div>
          ))}
        </div>
      </div>

      <div className="flex items-center gap-3 mt-1">
        <span className={'shrink-0 hidden sm:flex items-center gap-1 text-[10px] font-medium ' + t.meta}>
          <svg className="w-[13px] h-[13px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M4.5 12h15"/></svg>
          کشیدن
        </span>
        <div className="flex-1 py-1.5 cursor-pointer" role="slider" tabIndex={0}
          aria-label="موقعیت در اسلایدر" aria-valuemin={0} aria-valuemax={100}
          aria-valuenow={Math.round(prog * 100)}
          onPointerDown={seek} onKeyDown={onKey}>
          <div className="h-[3px] rounded-full overflow-hidden" style={{ background: t.track }}>
            <div className="h-full rounded-full" style={{ width: (prog * 100).toFixed(2) + '%', background: t.fill }}/>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- بخش کمپین: عنوان بالا، اسلایدر پایین، «مشاهده همه» در هدر ---------- */
function CampaignSection({ campaign, onAdd }) {
  const t = toneStyles(campaign.tone);

  /* اسلات‌ها همین‌جا ساخته می‌شوند؛ بدون فرزند null → بدون کارت خالی */
  const slides = [];
  if (campaign.endsAt) slides.push(<TimerSlide key="timer" endsAt={campaign.endsAt}/>);
  campaign.products.forEach(p => slides.push(<ProductCard key={p.id} p={p} onAdd={onAdd}/>));

  return (
    <section className={t.section}>
      {t.dark && (
        <div aria-hidden="true" className="absolute inset-0 opacity-[.05]"
          style={{ backgroundImage: 'radial-gradient(#F3F0E8 1px, transparent 1px)', backgroundSize: '24px 24px' }}/>
      )}
      <div className={'relative ' + t.pad}>
        <header className="flex flex-wrap items-end justify-between gap-x-5 gap-y-3 pe-1 ps-3.5 sm:ps-4 lg:ps-[18px]">
          <div className="min-w-0">
            <div className="flex items-center gap-2 mb-2">
              <span className={'rounded-full text-[10px] font-bold px-2.5 py-[5px] ' + t.tag}>{campaign.tag}</span>
              <span className={'text-[11px] font-medium ' + t.meta}>{fa(campaign.products.length)} محصول منتخب</span>
            </div>
            <h2 className={'font-naskh font-bold leading-[1.55] text-[19px] sm:text-[23px] ' + t.title}>{campaign.title}</h2>
            <p className={'mt-0.5 text-[11.5px] ' + t.note}>{campaign.note}</p>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            {campaign.endsAt && <MiniCountdown endsAt={campaign.endsAt}/>}
            <a href={campaign.url} className={'group inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-[12px] font-semibold transition ' + t.btn}>
              مشاهده همه
              <svg className="w-3.5 h-3.5 transition-transform group-hover:-translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg>
            </a>
          </div>
        </header>

        <div className="mt-4 sm:mt-5">
          <Carousel tone={campaign.tone} label={campaign.title}>{slides}</Carousel>
        </div>
      </div>
    </section>
  );
}

/* ---------- صفحه ---------- */
function App() {
  const [cart, setCart] = useState(0);
  return (
    <div className="min-h-screen">
      <TopBar cart={cart}/>
      <main className="max-w-[1240px] mx-auto px-4 sm:px-6 pb-2">
        <div className="flex flex-col gap-10 sm:gap-14">
          {CAMPAIGNS.map(c => (
            <CampaignSection key={c.id} campaign={c} onAdd={() => setCart(v => v + 1)}/>
          ))}
        </div>
        <footer className="mt-10 sm:mt-14 border-t border-[#DDD7C6] pt-6 pb-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-[11.5px] text-muted">
          <span className="flex items-center gap-2">
            <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="#2E4B3C" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
            داروخانه سبزدار · عرضه‌کننده‌ی محصولات اورجینال
          </span>
          <span>ارسال رایگان سفارش‌های بالای ۵۰۰٬۰۰۰ تومان · پشتیبانی ۹ تا ۲۱</span>
        </footer>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
